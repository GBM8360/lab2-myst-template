name: MyST GitHub Pages Deploy
on:
  push:
    branches:
      - main
env:
  # Determines where the website is served from, including CSS & JS assets.
  # Resolves to your repository name automatically -- you should not need to edit this.
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: `enablement: true` does NOT reliably turn Pages on for you. Creating a
      # Pages site calls an API that requires *admin* rights, and the token a workflow
      # gets only has *write* -- so on a brand-new repo this step fails with
      # "Create Pages site failed: Resource not accessible by integration".
      #
      # Enable Pages once, by hand: Settings -> Pages -> Source -> GitHub Actions.
      # After that this step is a harmless no-op and every push deploys automatically.
      #
      # This step also fails if the organization has workflow permissions set to
      # read-only -- the `permissions:` block above can only narrow that default,
      # never widen it.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Keep this matching what students use locally
          # (conda create -n myst python=3.13) so a build that works on their
          # machine works here too.
          python-version: '3.13'
          cache: pip

      - name: Install system dependencies for Jupyter
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Register the Jupyter kernel
        run: |
          python -m ipykernel install --user --name=python3
          jupyter kernelspec list --json

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install MyST Markdown
        run: npm install -g mystmd

      # --execute runs every notebook here, in CI, so the figures on the published
      # site always match the code in the repo. Drop the flag if it misbehaves --
      # MyST will then use whatever outputs are saved in the .ipynb files instead.
      - name: Build HTML
        run: myst build --html --execute

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # PDF export. Runs alongside the website build, never blocks it.
  #
  # `myst.yml` declares `exports: [{format: pdf}]`, and MyST renders that through
  # LaTeX -- so this job installs a TeX distribution, which is why it is kept
  # separate: it adds a couple of minutes, and the site should publish whether or
  # not the PDF succeeds. `continue-on-error` means a broken PDF shows as a
  # warning rather than failing your whole run.
  #
  # NOTE: interactive figures cannot appear in a PDF. A Plotly slider is
  # JavaScript; print has no equivalent. MyST warns "Figure with no non-caption
  # content" and leaves the caption. If a figure matters on paper, add a static
  # version alongside the interactive one.
  # ---------------------------------------------------------------------------
  pdf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Register the Jupyter kernel
        run: python -m ipykernel install --user --name=python3

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install MyST Markdown
        run: npm install -g mystmd

      - name: Install LaTeX
        run: |
          sudo apt-get update
          # `lmodern` is its own package on Debian/Ubuntu -- the book template does
          # \usepackage{lmodern} and fails without it. texlive-xetex is needed because
          # latexmk drives xelatex here.
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-xetex

      - name: Build PDF
        run: myst build --pdf --execute

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: exports/*.pdf
          # `error`, not `warn`: a missing PDF should be visible. The job is
          # continue-on-error, so this still never blocks the website deploy.
          if-no-files-found: error
